<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>
  <style>
    body {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    #color-picker {
      margin-top: 20px;
    }

    #opacity-slider {
      margin-top: 20px;
    }

    #close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 30px;
      height: 30px;
      background-color: red;
      color: white;
      border: none;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <button id="close-btn">X</button>
  <h2>设置背景</h2>
  <label for="color-picker">选择颜色:</label>
  <input type="color" id="color-picker" value="#ffffff">
  <br>
  <label for="opacity-slider">调整透明度:</label>
  <input type="range" id="opacity-slider" min="0" max="100" value="100">
  <p id="opacity-value">100%</p>

  <script>
    const { ipcRenderer } = require('electron');

    // 关闭设置窗口
    document.getElementById('close-btn').addEventListener('click', () => {
      ipcRenderer.send('close-settings-window');
    });

    // 颜色选择器改变事件
    document.getElementById('color-picker').addEventListener('input', (event) => {
      const color = event.target.value;
      const opacity = document.getElementById('opacity-slider').value;
      ipcRenderer.send('change-background-color', color, opacity / 100);
    });

    // 透明度滑块改变事件
    document.getElementById('opacity-slider').addEventListener('input', (event) => {
      const opacity = event.target.value;
      document.getElementById('opacity-value').textContent = `${opacity}%`;
      const color = document.getElementById('color-picker').value;
      ipcRenderer.send('change-background-color', color, opacity / 100);
    });
  </script>
</body>
</html>
